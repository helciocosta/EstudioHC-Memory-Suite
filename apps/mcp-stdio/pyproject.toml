[project]
name = "estudiohc-mcp-stdio"
version = "3.0.0"
description = "EstudioHC MCP stdio server for local AI agents"
requires-python = ">=3.11"

dependencies = [
    "mcp>=1.27.0",
    "sqlalchemy>=2.0.36",
]

[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
include = ["src*"]