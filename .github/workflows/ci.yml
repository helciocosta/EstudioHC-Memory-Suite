name: CI
on:
  push:
    branches: [master]
  pull_request:

jobs:
  test-api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install deps
        working-directory: apps/api
        run: pip install -e ".[dev]"
      - name: Run tests
        working-directory: apps/api
        run: python -m pytest -v
