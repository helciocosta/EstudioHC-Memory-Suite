services:
  hermes-sandbox:
    build:
      context: ./apps/hermes-sandbox
    image: hermes-sandbox:latest
    network_mode: none

  api:
    build:
      context: apps/api
      dockerfile: Dockerfile
    container_name: estudiohc-api
    restart: unless-stopped
    volumes:
      - ./data:/root/Apps/EstudioHC-Memory-Suite/data
      - ./apps/dashboard/static:/app/static
      - /home/deploy/.local/bin/hermes:/usr/local/bin/hermes:ro
      - /etc/estudiohc/ssl:/etc/estudiohc/ssl:ro
    environment:
      - DATABASE_URL=sqlite+aiosqlite:////root/Apps/EstudioHC-Memory-Suite/data/estudiohc.db
      - CORS_ORIGINS=["*"]
      - HERMES_CLI=/usr/local/bin/hermes

  dashboard:
    build:
      context: apps/dashboard
      dockerfile: Dockerfile
    container_name: estudiohc-dashboard
    restart: unless-stopped
    ports:
      - 8585:8585
    depends_on:
      - api
    environment:
      - PORT=8585
      - API_URL=http://api:5050
